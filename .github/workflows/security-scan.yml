name: Security Scan

# Static security analysis of the Terraform. Does not touch AWS.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: trivy (IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          # Surface findings without failing the build initially; flip to '1'
          # once the team is ready to enforce.
          exit-code: "0"
          severity: CRITICAL,HIGH

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true # report findings without failing CI by default
          framework: terraform
